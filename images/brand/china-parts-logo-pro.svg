<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" role="img" aria-label="CHINA PARTS | قطع غيار السيارات الصينية">
  <defs>
    <!-- Background / Glow Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b82"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Filters for Glow & Depth -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(20, 10)" filter="url(#drop-shadow)">
    <!-- Outer Shield / Hexagonal Emblem -->
    <path d="M50 0 L92 24 L92 76 L50 100 L8 76 L8 24 Z" fill="url(#metal-dark)" stroke="url(#cyan-glow)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner Precision Shield Contour -->
    <path d="M50 8 L84 28 L84 72 L50 92 L16 72 L16 28 Z" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Gear Teeth & Automotive Precision Geometry -->
    <g transform="translate(50, 50)">
      <!-- Outer Gear Silhouette -->
      <circle r="26" fill="url(#primary-grad)"/>
      <circle r="22" fill="#090d16" stroke="url(#cyan-glow)" stroke-width="1.5"/>
      
      <!-- Mechanical Gear Spokes -->
      <g fill="url(#silver-grad)">
        <rect x="-3" y="-30" width="6" height="8" rx="1.5"/>
        <rect x="-3" y="22" width="6" height="8" rx="1.5"/>
        <rect x="-30" y="-3" width="8" height="6" rx="1.5"/>
        <rect x="22" y="-3" width="8" height="6" rx="1.5"/>
        <rect x="-21" y="-21" width="6" height="7" rx="1.5" transform="rotate(45)"/>
        <rect x="15" y="15" width="6" height="7" rx="1.5" transform="rotate(45)"/>
        <rect x="15" y="-21" width="6" height="7" rx="1.5" transform="rotate(-45)"/>
        <rect x="-21" y="15" width="6" height="7" rx="1.5" transform="rotate(-45)"/>
      </g>

      <!-- Center Dynamic Piston / Spark Core -->
      <circle r="13" fill="url(#primary-grad)"/>
      <path d="M-6 -6 L6 0 L-6 6 L-2 0 Z" fill="#ffffff" filter="url(#soft-glow)"/>
      <circle r="4" fill="#38bdf8"/>
    </g>

    <!-- Speed Arc Accents -->
    <path d="M8 35 Q 2 50, 8 65" fill="none" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M92 35 Q 98 50, 92 65" fill="none" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(136, 12)">
    <!-- English Brand Name -->
    <text x="0" y="48" font-family="'Cairo', 'Segoe UI', 'Montserrat', sans-serif" font-size="38" font-weight="900" letter-spacing="2.5" fill="url(#silver-grad)">
      CHINA<tspan fill="#38bdf8">PARTS</tspan>
    </text>

    <!-- Sleek Tech Divider Line -->
    <path d="M0 62 L360 62" stroke="url(#cyan-glow)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="360" cy="62" r="3" fill="#38bdf8" filter="url(#soft-glow)"/>

    <!-- Arabic Brand Name & Tagline -->
    <text x="0" y="86" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      قطع غيار السيارات الصينية
      <tspan fill="#94a3b8" font-size="13" font-weight="500"> | توافق موثّق بالـ VIN</tspan>
    </text>
  </g>
</svg>
