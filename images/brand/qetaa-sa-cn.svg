<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="قطع الجنوب">
  <defs>
    <linearGradient id="sa-green" x1="4" y1="8" x2="36" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a8f4d"/>
      <stop offset="100%" stop-color="#006C35"/>
    </linearGradient>
    <linearGradient id="cn-red" x1="28" y1="6" x2="60" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f03a28"/>
      <stop offset="100%" stop-color="#DE2910"/>
    </linearGradient>
    <clipPath id="badge">
      <rect width="64" height="64" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <!-- Saudi side -->
    <path d="M0 0h38L26 64H0Z" fill="url(#sa-green)"/>
    <!-- China side -->
    <path d="M38 0h26v64H26Z" fill="url(#cn-red)"/>
    <!-- soft bridge band -->
    <path d="M34 0 24 64h6L40 0Z" fill="#ff6a00" opacity="0.92"/>
  </g>

  <!-- Saudi crescent -->
  <path d="M18.2 16.8c2.9-3.4 7.7-4.1 10.9-1.7-3.8.1-6.9 3.2-6.9 7.1 0 3.9 3.1 7 6.9 7.1-3.2 2.4-8 1.7-10.9-1.7-2.7-3.1-2.7-7.7 0-10.8Z" fill="#fff"/>

  <!-- China star -->
  <path d="M47.2 14.6 48.6 18.8l4.5.3-3.5 2.9 1.1 4.3-3.5-2.5-3.5 2.5 1.1-4.3-3.5-2.9 4.5-.3Z" fill="#FFDE00"/>

  <!-- auto-parts gear (shared craft) -->
  <g transform="translate(32 38)">
    <circle r="13.2" fill="none" stroke="#fff" stroke-width="3.1"/>
    <g fill="#fff">
      <rect x="-2.7" y="-16.2" width="5.4" height="5.2" rx="1.2"/>
      <rect x="-2.7" y="11" width="5.4" height="5.2" rx="1.2"/>
      <rect x="-16.2" y="-2.7" width="5.2" height="5.4" rx="1.2"/>
      <rect x="11" y="-2.7" width="5.2" height="5.4" rx="1.2"/>
      <rect x="-12.3" y="-12.3" width="5.2" height="5.4" rx="1.2" transform="rotate(-45)"/>
      <rect x="7.1" y="7.1" width="5.2" height="5.4" rx="1.2" transform="rotate(-45)"/>
      <rect x="7.1" y="-12.3" width="5.2" height="5.4" rx="1.2" transform="rotate(45)"/>
      <rect x="-12.3" y="7.1" width="5.2" height="5.4" rx="1.2" transform="rotate(45)"/>
    </g>
    <circle r="7.6" fill="#fff"/>
    <!-- south mark = الجنوب -->
    <path d="M0-5.2v9.8" stroke="#0b1220" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M0 8.4-4.8 1.8h9.6Z" fill="#0b1220"/>
  </g>
</svg>
