<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" role="img" aria-label="CHINA PARTS Light Logo">
  <defs>
    <linearGradient id="l-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b82"/>
    </linearGradient>

    <linearGradient id="l-cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="l-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="l-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(20, 10)" filter="url(#l-drop-shadow)">
    <path d="M50 0 L92 24 L92 76 L50 100 L8 76 L8 24 Z" fill="#0f172a" stroke="url(#l-cyan-glow)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <g transform="translate(50, 50)">
      <circle r="26" fill="url(#l-primary-grad)"/>
      <circle r="22" fill="#ffffff" stroke="url(#l-cyan-glow)" stroke-width="1.5"/>
      
      <g fill="#0f172a">
        <rect x="-3" y="-30" width="6" height="8" rx="1.5"/>
        <rect x="-3" y="22" width="6" height="8" rx="1.5"/>
        <rect x="-30" y="-3" width="8" height="6" rx="1.5"/>
        <rect x="22" y="-3" width="8" height="6" rx="1.5"/>
        <rect x="-21" y="-21" width="6" height="7" rx="1.5" transform="rotate(45)"/>
        <rect x="15" y="15" width="6" height="7" rx="1.5" transform="rotate(45)"/>
        <rect x="15" y="-21" width="6" height="7" rx="1.5" transform="rotate(-45)"/>
        <rect x="-21" y="15" width="6" height="7" rx="1.5" transform="rotate(-45)"/>
      </g>

      <circle r="13" fill="url(#l-primary-grad)"/>
      <path d="M-6 -6 L6 0 L-6 6 L-2 0 Z" fill="#ffffff"/>
      <circle r="4" fill="#38bdf8"/>
    </g>

    <path d="M8 35 Q 2 50, 8 65" fill="none" stroke="url(#l-cyan-glow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M92 35 Q 98 50, 92 65" fill="none" stroke="url(#l-cyan-glow)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(136, 12)">
    <text x="0" y="48" font-family="'Cairo', 'Segoe UI', 'Montserrat', sans-serif" font-size="38" font-weight="900" letter-spacing="2.5" fill="url(#l-dark-grad)">
      CHINA<tspan fill="#0284c7">PARTS</tspan>
    </text>

    <path d="M0 62 L360 62" stroke="url(#l-cyan-glow)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="360" cy="62" r="3" fill="#0284c7"/>

    <text x="0" y="86" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="16" font-weight="700" fill="#334155" letter-spacing="0.5">
      قطع غيار السيارات الصينية
      <tspan fill="#64748b" font-size="13" font-weight="500"> | توافق موثّق بالـ VIN</tspan>
    </text>
  </g>
</svg>
